<!-- TAB 5: AI APPROVAL QUEUE (GATED MCP REVIEW) -->
<section id="view-review" class="hidden space-y-6">
  <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
      <div>
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="shield-alert" class="w-5 h-5 text-amber-500"></i>
          Intermediate Approval Queue for AI Annotations
        </h2>
        <p class="text-xs text-slate-500 mt-0.5">Annotations submitted by external AI / MCP agents are gated here. Approve or edit before inclusion in dataset.</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="ReviewComponent.loadPending()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg flex items-center gap-1.5 transition-all">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
        </button>
        <button onclick="ReviewComponent.bulkApproveAll()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow transition-all flex items-center gap-1.5">
          <i data-lucide="check-check" class="w-3.5 h-3.5"></i> Approve All Loaded
        </button>
      </div>
    </div>

    <div id="ai-review-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
      <div class="col-span-2 text-center py-12 text-slate-400 text-xs">
        <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
        No AI annotations currently pending review.
      </div>
    </div>
  </div>
</section>
