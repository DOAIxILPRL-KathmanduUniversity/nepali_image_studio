<!-- TAB 3: GALLERY & MULTI-CRITERIA BROWSER -->
<section id="view-gallery" class="hidden space-y-4">
  
  <!-- Approved Dataset Banner (Shows when Approved filter is active) -->
  <div id="gal-approved-banner" class="hidden bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-4 rounded-2xl shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-white">
        <i data-lucide="badge-check" class="w-6 h-6"></i>
      </div>
      <div>
        <h4 class="font-bold text-sm">Certified Approved Nepali Dataset</h4>
        <p class="text-xs text-emerald-100">All displayed documents have been verified by human annotation or gated review.</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="App.exportDataset('jsonl')" class="px-3.5 py-1.5 bg-white hover:bg-slate-100 text-emerald-800 font-bold text-xs rounded-xl shadow-xs transition-all flex items-center gap-1.5">
        <i data-lucide="download" class="w-3.5 h-3.5"></i> Export JSONL
      </button>
      <button onclick="App.exportDataset('llava')" class="px-3.5 py-1.5 bg-emerald-800 hover:bg-emerald-900 text-white font-bold text-xs rounded-xl shadow-xs transition-all flex items-center gap-1.5">
        <i data-lucide="bot" class="w-3.5 h-3.5"></i> LLaVA Visual Tuning
      </button>
      <button onclick="App.exportDataset('csv')" class="px-3.5 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-xs rounded-xl transition-all flex items-center gap-1.5">
        <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> CSV
      </button>
    </div>
  </div>

  <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
    
    <!-- Status Filter Pills & Sorting Toolbar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-3 border-b border-slate-100">
      
      <!-- Quick Status Filter Pills (DashCode style) -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0">
        <button id="gal-pill-all" onclick="GalleryComponent.setStatusTab('')" class="gal-tab-pill px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-rose-600 text-white transition-all">
          All Documents
        </button>
        <button id="gal-pill-ready" onclick="GalleryComponent.setStatusTab('ready')" class="gal-tab-pill px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600 hover:text-slate-900 transition-all">
          Ready for Annotation
        </button>
        <button id="gal-pill-ai_pending" onclick="GalleryComponent.setStatusTab('ai_pending')" class="gal-tab-pill px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600 hover:text-slate-900 transition-all">
          AI Pending Review
        </button>
        <button id="gal-pill-approved" onclick="GalleryComponent.setStatusTab('approved')" class="gal-tab-pill px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600 hover:text-slate-900 transition-all">
          Approved Dataset
        </button>
      </div>

      <!-- Controls: Sort By & Category -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Sort By Selector -->
        <div class="flex items-center gap-1">
          <span class="text-xs text-slate-400 font-medium hidden sm:inline">Sort:</span>
          <select id="gal-sort-by" onchange="GalleryComponent.loadPage(1)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium focus:ring-1 focus:ring-rose-500 focus:outline-none">
            <option value="newest" selected>Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="file_size">Largest File Size</option>
            <option value="resolution">Highest Resolution</option>
            <option value="random">Random Shuffle</option>
          </select>
        </div>

        <!-- Document Category Filter -->
        <select id="gal-filter-type" onchange="GalleryComponent.loadPage(1)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium focus:ring-1 focus:ring-rose-500 focus:outline-none">
          <option value="">All Categories</option>
          <option value="citizenship">Citizenship (नागरिकता)</option>
          <option value="lalpurja">Land Deed (लालपुर्जा)</option>
          <option value="gazette">Gazette (राजपत्र)</option>
          <option value="license">Driving License</option>
          <option value="certificate">Certificate</option>
          <option value="letter">Official Circular</option>
          <option value="form">Government Form</option>
          <option value="newspaper">Newspaper</option>
          <option value="photo">Cultural Photo</option>
        </select>

        <!-- Limit -->
        <select id="gal-filter-limit" onchange="GalleryComponent.loadPage(1)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg p-2 font-medium focus:outline-none">
          <option value="12">12 / page</option>
          <option value="24" selected>24 / page</option>
          <option value="48">48 / page</option>
          <option value="96">96 / page</option>
        </select>

        <!-- Search -->
        <div class="relative w-full sm:w-48">
          <input id="gal-search-text" type="text" onkeyup="if(event.key==='Enter') GalleryComponent.loadPage(1)" placeholder="Search OCR or text..." class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-3 py-2 focus:ring-1 focus:ring-rose-500 focus:outline-none">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5"></i>
        </div>
      </div>
    </div>

    <!-- Multi-Select Bulk Actions Toolbar (Dynamic on selection) -->
    <div id="gal-bulk-bar" class="hidden p-3 bg-slate-900 text-white rounded-xl flex items-center justify-between text-xs transition-all shadow-sm">
      <div class="flex items-center gap-2">
        <span class="font-bold text-amber-400" id="gal-bulk-count">0 selected</span>
        <button onclick="GalleryComponent.selectAllOnPage()" class="text-slate-300 hover:text-white underline text-[11px]">Select All</button>
        <button onclick="GalleryComponent.clearSelection()" class="text-slate-300 hover:text-white underline text-[11px]">Clear</button>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="GalleryComponent.bulkApproveSelected()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-semibold flex items-center gap-1 transition-all">
          <i data-lucide="check" class="w-3.5 h-3.5"></i> Bulk Approve
        </button>
        <button onclick="GalleryComponent.bulkSetCategoryPrompt()" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold flex items-center gap-1 transition-all">
          <i data-lucide="tag" class="w-3.5 h-3.5"></i> Set Category
        </button>
        <button onclick="GalleryComponent.bulkDiscardSelected()" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-semibold flex items-center gap-1 transition-all">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Discard
        </button>
      </div>
    </div>

    <!-- Document Grid -->
    <div id="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3.5 min-h-[320px]">
      <div class="col-span-full text-center py-12 text-slate-400 text-xs">Loading document gallery...</div>
    </div>

    <!-- Pagination Bar with Direct Page Jump -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-slate-100 text-xs">
      <div class="text-slate-500 flex items-center gap-3">
        <span id="gal-pagination-info">Showing 0-0 of 0</span>
        <!-- Direct Page Jump -->
        <div class="flex items-center gap-1.5">
          <span>Go to page:</span>
          <input id="gal-page-jump-inp" type="number" min="1" class="w-14 bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5 text-center text-xs font-semibold" onkeyup="if(event.key==='Enter') GalleryComponent.jumpToPage()">
          <button onclick="GalleryComponent.jumpToPage()" class="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-semibold">Go</button>
        </div>
      </div>
      <div class="flex items-center space-x-1" id="gal-pagination-btns"></div>
    </div>

  </div>
</section>
