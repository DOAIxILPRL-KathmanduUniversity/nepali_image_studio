<!-- DashCode Top Header Bar (Desktop & Mobile) -->
<header class="bg-white/95 backdrop-blur border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
  <div class="px-4 sm:px-6 h-14 flex items-center justify-between">

    <!-- Left: Mobile Brand & Active Breadcrumb Title -->
    <div class="flex items-center space-x-3">
      <!-- Mobile Only Brand Icon -->
      <div class="flex items-center md:hidden gap-2 cursor-pointer" onclick="App.switchTab('dashboard')">
        <div
          class="w-8 h-8 rounded-lg bg-gradient-to-tr from-rose-600 to-amber-500 flex items-center justify-center text-white font-extrabold text-sm shadow">
          ने
        </div>
        <span class="text-xs font-bold text-slate-900">Open Nepali Image</span>
      </div>

      <!-- Desktop Breadcrumbs / Section Title -->
      <div class="hidden md:flex items-center gap-2 text-xs">
        <span class="text-slate-400 font-medium">Platform</span>
        <span class="text-slate-300">/</span>
        <h2 id="top-breadcrumb-title" class="font-bold text-slate-800 text-sm">Dashboard Overview</h2>
      </div>
    </div>

    <!-- Right: Status Indicators & Quick Actions -->
    <div class="flex items-center space-x-2 text-xs">
      <!-- Crawler Strategy Mode Pill (Desktop) -->
      <div
        class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-slate-100 rounded-lg text-slate-700 text-[11px] font-medium border border-slate-200/60">
        <span id="top-crawler-live-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span class="text-slate-500">Mode:</span>
        <strong id="top-crawler-mode-lbl" class="text-slate-800 font-semibold capitalize">Balanced</strong>
      </div>

      <!-- Media Backlog Counter (Live Alert Pill) -->
      <button onclick="App.switchTab('crawler')"
        class="flex items-center gap-1.5 px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-[11px] font-semibold border border-blue-200/60 transition-all"
        title="Click to view media queue">
        <i data-lucide="inbox" class="w-3.5 h-3.5 text-blue-600"></i>
        <span>Backlog: <strong id="top-media-backlog-count">0</strong></span>
      </button>

      <!-- Phone LAN Access Pill -->
      <button onclick="App.toggleQrModal()"
        class="flex items-center gap-1.5 px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200/80 rounded-lg font-semibold text-[11px] transition-all"
        title="Pair Phone via Local Router Wi-Fi">
        <i data-lucide="smartphone" class="w-3.5 h-3.5 text-rose-600"></i>
        <span class="hidden sm:inline">Phone: </span>
        <span id="phone-access-url" class="font-mono-code">192.168.10.108:8000</span>
        <i data-lucide="qr-code" class="w-3 h-3 text-rose-500"></i>
      </button>
    </div>
  </div>
</header>
